name: TALI UI Demo image and Helm chart

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.18.4
      - uses: docker/login-action@v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image and chart versions
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tali-ui-demo"
          image_tag="sha-${GITHUB_SHA::12}-${GITHUB_RUN_ID}"
          storage=browser
          chart_version="0.2.24-dev.${GITHUB_RUN_NUMBER}"
          tags=("${image}:${image_tag}")
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            tags+=("${image}:pr-${{ github.event.pull_request.number }}")
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
            chart_version="${GITHUB_REF_NAME#v}"
            tags+=("${image}:${chart_version}" "${image}:${GITHUB_REF_NAME}")
          else
            branch="${GITHUB_REF_NAME,,}"
            branch="${branch//\//-}"
            branch="${branch//_/-}"
            tags+=("${image}:${branch}")
            if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
              chart_version="0.2.24-main.${GITHUB_RUN_NUMBER}"
              tags+=("${image}:latest")
            fi
          fi
          {
            echo "name=${image}"
            echo "storage=${storage}"
            echo "image_tag=${image_tag}"
            echo "chart_version=${chart_version}"
            echo "chart_registry=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
            echo 'tags<<EOF'
            printf '%s\n' "${tags[@]}"
            echo EOF
          } >> "${GITHUB_OUTPUT}"

      - name: Build and optionally publish image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./deploy/Dockerfile.marketplace
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            TALI_UI_DEMO_CHART_VERSION=${{ steps.image.outputs.chart_version }}
            TALI_UI_DEMO_IMAGE_REPOSITORY=${{ steps.image.outputs.name }}
            TALI_UI_DEMO_IMAGE_TAG=${{ steps.image.outputs.image_tag }}
            TALI_UI_DEMO_STORAGE=${{ steps.image.outputs.storage }}
          labels: |
            org.opencontainers.image.title=AI Marketplace
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=tali-marketplace
          cache-to: type=gha,mode=max,scope=tali-marketplace
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Verify runtime and embedded chart
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.image_tag }}
          CHART_VERSION: ${{ steps.image.outputs.chart_version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then docker pull "$IMAGE"; fi
          container=""
          connection_volume=""
          cleanup() { if [[ -n "$container" ]]; then docker logs "$container"; docker rm -f "$container"; fi; if [[ -n "$connection_volume" ]]; then docker volume rm "$connection_volume"; fi; }
          trap cleanup EXIT
          mkdir -p artifacts
          connection_volume="marketplace-connection-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$connection_volume"
          docker run --rm --read-only --mount "type=volume,source=${connection_volume},target=/var/lib/marketplace/connection" \
            --entrypoint node "$IMAGE" -e 'require("node:fs").writeFileSync("/var/lib/marketplace/connection/permission-probe", "ok", {mode:0o600})'
          docker run --rm --read-only --mount "type=volume,source=${connection_volume},target=/var/lib/marketplace/connection" \
            --entrypoint node "$IMAGE" -e 'const fs=require("node:fs");if(fs.readFileSync("/var/lib/marketplace/connection/permission-probe","utf8")!=="ok")process.exit(1)'
          docker volume rm "$connection_volume"
          connection_volume=""
          for mode in mock live; do
            container=$(docker run -d --read-only --tmpfs /tmp -p 127.0.0.1:18082:8080 \
              -e MARKETPLACE_DATA_MODE="$mode" -e MARKETPLACE_DEMO_STORAGE=memory -e GUARD_API_URL=http://guard.internal/api/v1 "$IMAGE")
            curl --fail --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 90 --max-time 5 http://127.0.0.1:18082/api/health
            curl --fail http://127.0.0.1:18082/api/marketplace-config | jq -e --arg mode "$mode" '.mode == $mode'
            if [[ "$mode" == "mock" ]]; then
              curl --fail http://127.0.0.1:18082/api/marketplace-config | jq -e '.sharedDemo == true'
              curl --fail http://127.0.0.1:18082/api/demo-state | jq -e '.revision == 0'
              curl --fail -X PUT http://127.0.0.1:18082/api/demo-state \
                -H 'Origin: http://127.0.0.1:18082' -H 'Content-Type: application/json' \
                --data '{"revision":0,"items":[]}' | jq -e '.revision == 1'
              curl --fail http://127.0.0.1:18082/api/demo-state | jq -e '.revision == 1'
            fi
            curl --fail http://127.0.0.1:18082/guardrails > /dev/null
            curl --fail http://127.0.0.1:18082/v1/guardrails > /dev/null
            curl --fail http://127.0.0.1:18082/v2/guardrails > /dev/null
            # ClientOnly pages hydrate after serving the shell. Do not require
            # their interactive heading to appear in the server HTML.
            curl --fail http://127.0.0.1:18082/v2/import > /dev/null
            curl --fail http://127.0.0.1:18082/v2-mock/guardrails > /dev/null
            curl --fail http://127.0.0.1:18082/v3/guardrails > /dev/null
            curl --fail http://127.0.0.1:18082/api/docs | grep 'SwaggerUIBundle'
            curl --fail http://127.0.0.1:18082/api/docs/swagger-ui-bundle.js > /dev/null
            curl --fail http://127.0.0.1:18082/api/docs/swagger-ui.css > /dev/null
            curl --fail http://127.0.0.1:18082/api/openapi.json | jq -e '.openapi == "3.1.0" and .paths["/api/nmgr/connection/test"].post != null'
            curl --fail http://127.0.0.1:18082/api/endpoints > /dev/null
            curl --fail http://127.0.0.1:18082/api/nmgr/connection | jq -e '.advanced.nemoTls == "skip"'
            docker cp "$container:/opt/tali/helm/tali-UI-demo.tgz" "artifacts/tali-ui-demo-${CHART_VERSION}.tgz"
            docker cp "$container:/opt/tali/source/project-source.zip" artifacts/project-source.zip
            docker cp "$container:/opt/tali/source/project-source.zip.sha256" artifacts/project-source.zip.sha256
            (cd artifacts && sha256sum -c project-source.zip.sha256)
            unzip -t artifacts/project-source.zip >/dev/null
            unzip -l artifacts/project-source.zip | grep 'project/web/apps/control/src/features/business-demo/profile-operations.tsx'
            unzip -l artifacts/project-source.zip | grep 'project/scripts/uat/verify-ui-isolation.mjs'
            unzip -l artifacts/project-source.zip | grep 'project/docs/integration-api.md'
            unzip -l artifacts/project-source.zip | grep 'project/web/apps/control/marketplace-server/openapi.ts'
            unzip -l artifacts/project-source.zip | grep 'project/web/apps/control/marketplace-server/fixtures/connection-tls/localhost-test-key.txt'
            docker exec "$container" test -f /opt/marketplace/check-nemo.mjs
            docker rm -f "$container"
            container=""
          done
          container=$(docker run -d --user 1001230000:0 --read-only --tmpfs /tmp -p 127.0.0.1:18082:8080 \
            -e MARKETPLACE_DATA_MODE=mock -e MARKETPLACE_DEMO_STORAGE=memory -e MARKETPLACE_DEMO_DB_FILE=/unwritable/demo.sqlite "$IMAGE")
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 90 --max-time 5 http://127.0.0.1:18082/api/health
          curl --fail http://127.0.0.1:18082/api/marketplace-config | jq -e '.sharedDemo == true'
          curl --fail http://127.0.0.1:18082/api/demo-state | jq -e '.revision == 0 and .items == []'
          curl --fail http://127.0.0.1:18082/api/demo-backup | grep 'Export current cases'
          curl --fail 'http://127.0.0.1:18082/api/demo-state?download=1' > artifacts/demo-backup.json
          jq -e '.format == "tali-demo" and .version == 1' artifacts/demo-backup.json
          jq '{revision:0,backup:.}' artifacts/demo-backup.json > artifacts/demo-restore.json
          curl --fail -X PUT http://127.0.0.1:18082/api/demo-state \
            -H 'Origin: http://127.0.0.1:18082' -H 'Content-Type: application/json' \
            --data-binary @artifacts/demo-restore.json | jq -e '.revision == 1'
          docker rm -f "$container"
          container=""
          chart="artifacts/tali-ui-demo-${CHART_VERSION}.tgz"
          container=$(docker run -d --user 1001230000:0 --read-only --tmpfs /tmp -p 127.0.0.1:18082:8080 -e MARKETPLACE_DEMO_STORAGE=browser "$IMAGE")
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:18082/api/health
          curl --fail http://127.0.0.1:18082/api/marketplace-config | jq -e '.browserDemo == true and .sharedDemo == false'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18082/api/demo-state)" = 404
          curl --fail http://127.0.0.1:18082/api/demo-backup | grep 'Cases are stored only in this browser'
          docker rm -f "$container"
          container=""
          helm lint "$chart"
          helm template tali-ui-demo "$chart" > artifacts/mock.yaml
          grep -A1 'name: MARKETPLACE_NEMO_TLS' artifacts/mock.yaml | grep 'value: "skip"'
          helm template tali-ui-demo "$chart" --set marketplace.nemoTls=verify > artifacts/nemo-tls-verify.yaml
          grep -A1 'name: MARKETPLACE_NEMO_TLS' artifacts/nemo-tls-verify.yaml | grep 'value: "verify"'
          helm template tali-ui-demo "$chart" --set openshift.enabled=true > artifacts/ocp.yaml
          if grep -Eq 'PersistentVolumeClaim|claimName:|runAsUser:|fsGroup:' artifacts/ocp.yaml; then
            echo 'OCP template unexpectedly requires a PVC or fixed UID'; exit 1
          fi
          helm template tali-ui-demo "$chart" --set marketplace.dataMode=live \
            --set marketplace.guardApiUrl=https://guard.internal/api/v1 > artifacts/live.yaml
          helm template tali-ui-demo "$chart" --set marketplace.dataMode=live \
            --set marketplace.v2Live=true --set marketplace.databaseSecret=missing-db \
            --set marketplace.nemoTokenSecret=missing-nemo \
            --set marketplace.accountsConfigMap=missing-accounts > artifacts/incomplete-live.yaml
          test "$(grep -c 'path: /api/health' artifacts/incomplete-live.yaml)" = 3
          if grep -Eq '^\s+path: /api/nmgr/ready' artifacts/incomplete-live.yaml; then
            echo 'Real diagnostics must not gate shared UI readiness'; exit 1
          fi

      - name: Verify real integration failures keep Mock available
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.image_tag }}
        run: node scripts/uat/verify-ui-isolation.mjs "$IMAGE" artifacts/isolation-test-results.json

      - name: Preserve release verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-release-${{ steps.image.outputs.chart_version }}
          path: artifacts/

      - name: Publish OCI Helm chart
        if: github.event_name != 'pull_request' && (github.ref_type == 'tag' || github.ref_name == 'main')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_VERSION: ${{ steps.image.outputs.chart_version }}
          CHART_REGISTRY: ${{ steps.image.outputs.chart_registry }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "artifacts/tali-ui-demo-${CHART_VERSION}.tgz" "$CHART_REGISTRY"
          helm show chart "${CHART_REGISTRY}/tali-ui-demo" --version "$CHART_VERSION"
