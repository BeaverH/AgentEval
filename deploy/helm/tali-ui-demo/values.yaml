replicaCount: 1

# Legacy values retained for upgrade compatibility; memory SQLite does not use PVCs.
persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  size: 1Gi

openshift:
  enabled: false
  route:
    enabled: false
    host: ""

image:
  repository: ghcr.io/idddd/tali-ui-demo
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

marketplace:
  demoStorage: browser
  dataMode: mock
  guardApiUrl: ""
  # V3 demo only: skip or verify NeMo HTTPS certificates. Other TLS remains unchanged.
  nemoTls: skip
  # NeMo's trusted public origin when guardApiUrl uses an internal service hostname.
  guardAuthOrigin: ""
  # Existing Secret containing GUARD_USERNAME and GUARD_PASSWORD.
  nemoSecret: ""
  # Default V3 uses a raw NeMo business-user PAT from this existing Secret.
  # Password-based nemoSecret is a legacy/strict-mode alternative.
  nemoTokenSecret: tali
  nemoTokenKey: tali-guard-bootstrap-user-ini
  policyAuthoringUrl: ""
  publicOrigin: ""
  crudOnly: false
  # Existing database Secret; never put credentials here.
  databaseSecret: tali
  databaseUrlKey: tali-guard-postgresql-init
  # Leave empty when the URL already contains the correct application's password.
  databasePasswordKey: ""
  databaseTls: false
  # Legacy setting name retained for real-workspace deployment notes.
  # UI probes always use /api/health; inspect /api/nmgr/ready separately for V3.
  v2Live: false
  # Demo integration keeps role switching and needs no extra account mapping/SSO.
  # Set false only when explicitly using strict identity mode.
  demoRoles: true
  # Optional existing PVC for saved fallback connections across Pod replacement.
  connectionStorage:
    existingClaim: ""
  workspaceId: uat
  accountsConfigMap: ""
  caConfigMap: ""
  # Optional F5 AI Security. Token is server-only and supplied by an existing Secret.
  f5ApiUrl: ""
  f5Secret: ""
  f5ProjectAdminIds: ""

branding:
  existingConfigMap: ""
  logoFile: logo.svg
  faviconFile: favicon.svg

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
