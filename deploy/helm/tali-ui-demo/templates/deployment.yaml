{{- if not (has .Values.marketplace.dataMode (list "mock" "live" "auto")) }}
{{- fail "marketplace.dataMode must be mock, live or auto" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tali-ui-demo.fullname" . }}
  labels:
    {{- include "tali-ui-demo.labels" . | nindent 4 }}
spec:
  {{- if ne (int .Values.replicaCount) 1 }}
  {{- fail "This UAT chart requires replicaCount=1" }}
  {{- end }}
  strategy:
    type: Recreate
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tali-ui-demo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "tali-ui-demo.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- if .Values.openshift.enabled }}
        {{- omit .Values.podSecurityContext "runAsUser" "runAsGroup" "fsGroup" | toYaml | nindent 8 }}
        {{- else }}
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        {{- end }}
      containers:
        - name: ui
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MARKETPLACE_DEMO_STORAGE
              value: {{ .Values.marketplace.demoStorage | quote }}
            - name: MARKETPLACE_DATA_MODE
              value: {{ .Values.marketplace.dataMode | quote }}
            - name: MARKETPLACE_V3_DEMO
              value: {{ .Values.marketplace.demoRoles | quote }}
            - name: MARKETPLACE_CONNECTION_DIR
              value: /var/lib/marketplace/connection
            - name: MARKETPLACE_CONNECTION_PERSISTENT
              value: {{ if .Values.marketplace.connectionStorage.existingClaim }}"true"{{ else }}"false"{{ end }}
            - name: GUARD_API_URL
              value: {{ .Values.marketplace.guardApiUrl | quote }}
            - name: MARKETPLACE_NEMO_TLS
              value: {{ .Values.marketplace.nemoTls | default "skip" | quote }}
            - name: GUARD_AUTH_ORIGIN
              value: {{ .Values.marketplace.guardAuthOrigin | default "" | quote }}
            {{- if or .Values.marketplace.nemoSecret .Values.marketplace.nemoTokenSecret }}
            # Preserve the selected credential source even if its optional Secret is absent.
            - name: MARKETPLACE_NEMO_AUTH_MODE
              value: {{ if and .Values.marketplace.nemoSecret .Values.marketplace.nemoTokenSecret }}"invalid"{{ else if .Values.marketplace.nemoTokenSecret }}"token"{{ else }}"password"{{ end }}
            {{- end }}
            {{- if .Values.marketplace.nemoSecret }}
            - name: GUARD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.marketplace.nemoSecret | quote }}
                  key: GUARD_USERNAME
                  optional: true
            - name: GUARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.marketplace.nemoSecret | quote }}
                  key: GUARD_PASSWORD
                  optional: true
            {{- end }}
            {{- if .Values.marketplace.nemoTokenSecret }}
            - name: GUARD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.marketplace.nemoTokenSecret | quote }}
                  key: {{ .Values.marketplace.nemoTokenKey | default "GUARD_API_TOKEN" | quote }}
                  optional: true
            {{- end }}
            - name: MARKETPLACE_V2_LOCAL_ACCESS
              value: "false"
            - name: GUARD_POLICY_AUTHORING_URL
              value: {{ .Values.marketplace.policyAuthoringUrl | quote }}
            - name: MARKETPLACE_PUBLIC_ORIGIN
              value: {{ .Values.marketplace.publicOrigin | quote }}
            - name: MARKETPLACE_CRUD_ONLY
              value: {{ .Values.marketplace.crudOnly | quote }}
            - name: MARKETPLACE_F5_MOCK
              value: "false"
            {{- if .Values.marketplace.f5ApiUrl }}
            - name: F5_API_URL
              value: {{ .Values.marketplace.f5ApiUrl | quote }}
            {{- end }}
            {{- if .Values.marketplace.f5Secret }}
            - name: F5_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.marketplace.f5Secret | quote }}
                  key: F5_API_TOKEN
                  optional: true
            {{- end }}
            {{- if or .Values.marketplace.f5ApiUrl .Values.marketplace.f5Secret }}
            - name: MARKETPLACE_F5_ENABLED
              value: "true"
            - name: F5_PROJECT_ADMIN_IDS
              value: {{ .Values.marketplace.f5ProjectAdminIds | quote }}
            {{- end }}
            - name: MARKETPLACE_WORKSPACE_ID
              value: {{ .Values.marketplace.workspaceId | quote }}
            {{- if .Values.marketplace.accountsConfigMap }}
            - name: MARKETPLACE_V2_ACCOUNTS_FILE
              value: /opt/marketplace/accounts/accounts.json
            {{- end }}
            {{- if .Values.marketplace.caConfigMap }}
            - name: NODE_EXTRA_CA_CERTS
              value: /opt/marketplace/ca/ca.crt
            {{- if .Values.marketplace.databaseTls }}
            - name: MARKETPLACE_DB_CA_FILE
              value: /opt/marketplace/ca/ca.crt
            {{- end }}
            {{- end }}
            {{- if .Values.marketplace.databaseSecret }}
            - name: MARKETPLACE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.marketplace.databaseSecret | quote }}
                  key: {{ .Values.marketplace.databaseUrlKey | default "MARKETPLACE_DATABASE_URL" | quote }}
                  optional: true
            {{- if .Values.marketplace.databasePasswordKey }}
            - name: MARKETPLACE_DATABASE_PASSWORD_REQUIRED
              value: "true"
            - name: MARKETPLACE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.marketplace.databaseSecret | quote }}
                  key: {{ .Values.marketplace.databasePasswordKey | quote }}
                  optional: true
            {{- end }}
            - name: MARKETPLACE_DB_TLS
              value: {{ .Values.marketplace.databaseTls | quote }}
            {{- end }}
            {{- if .Values.branding.existingConfigMap }}
            - name: BRAND_LOGO_PATH
              value: {{ printf "/app/branding/%s" .Values.branding.logoFile | quote }}
            - name: BRAND_FAVICON_PATH
              value: {{ printf "/app/branding/%s" .Values.branding.faviconFile | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              # Keep the shared UI/Mock reachable when real integrations fail.
              # /api/nmgr/ready remains the strict V3 diagnostic endpoint.
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: connection-settings
              mountPath: /var/lib/marketplace/connection
            - name: runtime-tmp
              mountPath: /tmp
            {{- if .Values.marketplace.accountsConfigMap }}
            - name: accounts
              mountPath: /opt/marketplace/accounts
              readOnly: true
            {{- end }}
            {{- if .Values.marketplace.caConfigMap }}
            - name: ca
              mountPath: /opt/marketplace/ca
              readOnly: true
            {{- end }}
            {{- if .Values.branding.existingConfigMap }}
            - name: branding
              mountPath: /app/branding
              readOnly: true
            {{- end }}
      volumes:
        - name: connection-settings
          {{- if .Values.marketplace.connectionStorage.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.marketplace.connectionStorage.existingClaim | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: runtime-tmp
          emptyDir: {}
        {{- if .Values.marketplace.accountsConfigMap }}
        - name: accounts
          configMap:
            name: {{ .Values.marketplace.accountsConfigMap | quote }}
            optional: true
        {{- end }}
        {{- if .Values.marketplace.caConfigMap }}
        - name: ca
          configMap:
            name: {{ .Values.marketplace.caConfigMap | quote }}
            optional: true
        {{- end }}
        {{- if .Values.branding.existingConfigMap }}
        - name: branding
          configMap:
            name: {{ .Values.branding.existingConfigMap | quote }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
